<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 Mi Multi-Herramienta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    padding: 16px;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 24px 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(102,126,234,0.3);
  }
  header h1 { font-size: 1.6rem; margin-bottom: 4px; }
  header p  { font-size: 0.85rem; opacity: 0.85; }

  main {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    gap: 16px;
  }

  .card {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 14px;
    padding: 18px;
  }
  .card h2 {
    font-size: 1.1rem;
    color: #a78bfa;
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: #b0b0c0;
    margin-bottom: 10px;
  }

  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    margin-top: 6px;
    background: #0f0f1a;
    border: 1px solid #3a3a5a;
    border-radius: 8px;
    color: #fff;
    font-family: inherit;
    font-size: 0.9rem;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #667eea;
  }

  textarea {
    min-height: 130px;
    font-family: ui-monospace, monospace;
    resize: vertical;
    font-size: 0.8rem;
  }

  button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    margin: 8px 6px 0 0;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(102,126,234,0.4); }
  button:active { transform: translateY(0); }

  .resultado {
    display: block;
    background: #0a0a14;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    font-family: ui-monospace, monospace;
    font-size: 0.85rem;
    color: #7ee787;
    word-break: break-all;
    min-height: 40px;
    white-space: pre-wrap;
  }

  footer {
    text-align: center;
    margin-top: 32px;
    padding: 16px;
    color: #555;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <h1>🎲 Mi Multi-Herramienta</h1>
  <p>Hecha con HTML + JS · GitHub Pages</p>
</header>

<main>

  <!-- 🔐 Generador de contraseñas -->
  <section class="card">
    <h2>🔐 Generador de contraseñas seguras</h2>
    <label>Longitud:
      <input type="number" id="pwdLen" value="16" min="4" max="64">
    </label>
    <label>Incluir símbolos:
      <select id="pwdSym">
        <option value="no">No</option>
        <option value="si" selected>Sí</option>
      </select>
    </label>
    <button onclick="generarPassword()">🔐 Generar</button>
    <button onclick="copiar('pwdOut')">📋 Copiar</button>
    <div class="resultado" id="pwdOut">Tu contraseña aparecerá aquí…</div>
  </section>

  <!-- 🗑️ Eliminador de duplicados -->
  <section class="card">
    <h2>🗑️ Eliminador de duplicados</h2>
    <label>Pega tus líneas:
      <textarea id="dupIn" placeholder="uno&#10;dos&#10;uno&#10;tres"></textarea>
    </label>
    <button onclick="limpiarDuplicados()">🗑️ Limpiar</button>
    <button onclick="descargarTexto('dupOut','sin_duplicados')">💾 Descargar</button>
    <label style="margin-top:10px">Resultado:
      <textarea id="dupOut" readonly placeholder="Resultado sin duplicados…"></textarea>
    </label>
  </section>

  <!-- 🔤 Generador de usuarios fake -->
  <section class="card">
    <h2>🔤 Generador de usuarios aleatorios</h2>
    <label>Cantidad:
      <input type="number" id="usrQty" value="10" min="1" max="500">
    </label>
    <button onclick="generarUsuarios()">🔤 Generar</button>
    <button onclick="descargarTexto('usrOut','usuarios_fake')">💾 Descargar</button>
    <label style="margin-top:10px">Resultado:
      <textarea id="usrOut" readonly placeholder="Usuarios aleatorios…"></textarea>
    </label>
  </section>

</main>

<footer>
  <p>Desarrollado por <strong>EduardoXc-rgb</strong> · <span id="year"></span></p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // 🔐 Generador de contraseñas usando crypto (seguro)
  function generarPassword() {
    const len = Math.max(4, Math.min(64, +document.getElementById('pwdLen').value || 16));
    const usarSimbolos = document.getElementById('pwdSym').value === 'si';
    const letras = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numeros = '0123456789';
    const simbolos = '!@#$%^&*()-_=+[]{};:,.<>?';
    const charset = letras + numeros + (usarSimbolos ? simbolos : '');

    let pwd = '';
    const bytes = new Uint32Array(len);
    crypto.getRandomValues(bytes);
    for (let i = 0; i < len; i++) {
      pwd += charset[bytes[i] % charset.length];
    }
    document.getElementById('pwdOut').textContent = pwd;
  }

  // 🗑️ Eliminar duplicados conservando orden
  function limpiarDuplicados() {
    const txt = document.getElementById('dupIn').value;
    if (!txt.trim()) return alert('Pega algo primero');
    const lineas = txt.split('\n').map(l => l.trim()).filter(Boolean);
    const unicas = [...new Set(lineas)];
    document.getElementById('dupOut').value = unicas.join('\n');
  }

  // 🔤 Generador de usuarios fake
  const nombres = ['ana','luis','maria','carlos','sofia','pedro','lucia','diego','elena','jorge','marta','raul','nora','ivan','rosa','tomas'];
  const apellidos = ['garcia','lopez','martinez','rodriguez','perez','sanchez','ramirez','torres','flores','rivera','gomez','diaz'];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function num(max) { return Math.floor(Math.random() * max); }

  function generarUsuarios() {
    const qty = Math.max(1, Math.min(500, +document.getElementById('usrQty').value || 10));
    const out = [];
    for (let i = 0; i < qty; i++) {
      const n = pick(nombres);
      const a = pick(apellidos);
      const estilo = num(4);
      let usuario;
      if (estilo === 0) usuario = `${n}.${a}`;
      else if (estilo === 1) usuario = `${n}_${a}${num(100)}`;
      else if (estilo === 2) usuario = `${n}${a}${num(1000)}`;
      else usuario = `${n[0]}${a}${num(100)}`;
      out.push(usuario);
    }
    document.getElementById('usrOut').value = out.join('\n');
  }

  // 💾 Descargar cualquier campo como .txt
  function descargarTexto(idEl, nombreBase) {
    const el = document.getElementById(idEl);
    const txt = el.value !== undefined ? el.value : el.textContent;
    if (!txt || txt.includes('aparecerá')) return alert('No hay nada que descargar');
    const blob = new Blob([txt], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreBase + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  }

  // 📋 Copiar al portapapeles
  function copiar(idEl) {
    const txt = document.getElementById(idEl).textContent;
    navigator.clipboard.writeText(txt).then(
      () => alert('✅ Copiado'),
      () => alert('❌ No se pudo copiar')
    );
  }
</script>

</body>
</html>
